<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 205" width="940" height="205" role="img" aria-label="Vision AI analiz akışı: DICOM aç, Vision AI sekmesine geç, protokol seç, Analizi başlat, TASLAK adayları incele, raporu onayla">
  <rect width="940" height="205" rx="12" fill="#0b0f16"/>
  <g font-family="'Segoe UI',system-ui,Arial,sans-serif">
    <g fill="#0e141d" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5">
      <rect x="14"  y="34" width="126" height="74" rx="9"/>
      <rect x="172" y="34" width="126" height="74" rx="9"/>
      <rect x="330" y="34" width="126" height="74" rx="9"/>
      <rect x="488" y="34" width="126" height="74" rx="9"/>
      <rect x="646" y="34" width="126" height="74" rx="9"/>
      <rect x="804" y="34" width="122" height="74" rx="9" stroke="#22c55e"/>
    </g>
    <g fill="#22d3ee" font-size="17" font-weight="700" text-anchor="middle">
      <text x="77"  y="66">1</text><text x="235" y="66">2</text><text x="393" y="66">3</text>
      <text x="551" y="66">4</text><text x="709" y="66">5</text>
    </g>
    <text x="865" y="66" fill="#22c55e" font-size="17" font-weight="700" text-anchor="middle">6</text>
    <g fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">
      <text x="77"  y="88">DICOM aç</text>
      <text x="235" y="88">Vision AI sekmesi</text>
      <text x="393" y="88">Protokol seç</text>
      <text x="551" y="88">Analizi başlat</text>
      <text x="709" y="88">TASLAK adaylar</text>
      <text x="865" y="88" fill="#86efac">Onayla</text>
    </g>
    <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.85">
      <path d="M142 71 H168" marker-end="url(#arrow)"/>
      <path d="M300 71 H326" marker-end="url(#arrow)"/>
      <path d="M458 71 H484" marker-end="url(#arrow)"/>
      <path d="M616 71 H642" marker-end="url(#arrow)"/>
      <path d="M774 71 H800" marker-end="url(#arrow)"/>
    </g>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
      </marker>
    </defs>
    <g fill="#94a3b8" font-size="10.5" text-anchor="middle">
      <text x="77"  y="132">klasör / dosya / ZIP</text>
      <text x="235" y="132">sağ panel</text>
      <text x="393" y="132">Otomatik · Beyin · Toraks …</text>
      <text x="551" y="132">◀ AI worker gerekir</text>
      <text x="709" y="132">radyolog inceler</text>
      <text x="865" y="132">kilitli rapor</text>
    </g>
    <text x="470" y="172" fill="#fbbf24" font-size="11.5" font-weight="600" text-anchor="middle">Çıktının tamamı TASLAK’tır — “klinik karar için kullanılamaz” bandı kaldırılamaz; son söz radyoloji uzmanınındır.</text>
    <text x="470" y="192" fill="#64748b" font-size="9.5" text-anchor="middle">Worker kapalıysa BT analizi kural tabanlıya düşer (ekranda “worker: kapalı” uyarısı); CXR / ICH / diz MR çalışmaz.</text>
  </g>
</svg>
