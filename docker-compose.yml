# ATIKVIEWER — tek komutla tam yığın (uygulama + PostgreSQL).
# Kullanım:
#   1) cp .env.example .env   (POSTGRES_PASSWORD ve DATA_ENCRYPTION_KEY doldurun)
#   2) docker compose up --build -d
#   3) http://localhost:3000 adresini açın
# İlk açılışta şema otomatik uygulanır (drizzle-kit push).
#
# Yerel derin AI (MONAI akciğer + ICH beyin modelleri) ayrı bir servistir:
#   docker compose --profile ai up --build -d
# Worker kapalıyken uygulama kural tabanlı motora düşer ve durum satırı bunu belirtir.

name: atikviewer

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Dışarıdan DB erişimi gerekiyorsa açın:
    # ports:
    #   - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/app_db
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      PACS_AUTH_HEADER: ${PACS_AUTH_HEADER:-}
      HIS_API_KEY: ${HIS_API_KEY:-}
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # --profile ai ile worker açıksa http://ai-worker:8787; kapalıysa worker "down" görünür.
      AI_WORKER_URL: ${AI_WORKER_URL:-http://ai-worker:8787}
    volumes:
      # Şifreleme anahtarı (.data/enc.key) ve şifreli DICOM deposu burada saklanır.
      - appdata:/app/.data
    command: >
      sh -c "npx drizzle-kit push --config=drizzle.config.ts --force && npm start"

  # Gerçek PACS (Orthanc, DICOMweb) — okuma/yazma uçtan uca doğrulama için.
  # Kullanım: docker compose --profile pacs up -d  → http://localhost:8042
  # (anonim erişim). Test: npm run test:pacs-e2e
  orthanc:
    image: jodogne/orthanc:latest
    profiles: ["pacs"]
    restart: unless-stopped
    environment:
      ORTHANC__NAME: "ArenaViewer E2E PACS"
    ports:
      - "${ORTHANC_PORT:-8042}:8042"

  # Yerel derin AI worker'ı (opsiyonel). `docker compose --profile ai up --build -d`
  # ile başlatılır; ilk açılışta iki modeli (~231 MB) indirip /models volume'üne yazar.
  ai-worker:
    build:
      context: ./ai-worker
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      ATIK_MODEL_DIR: /models/model
      ATIK_BRAIN_DIR: /models/brain
      ATIK_SKIP_SETUP: ${ATIK_SKIP_SETUP:-0}
      ATIK_FORCE_CPU: "1"
    volumes:
      - aimodels:/models
    expose:
      - "8787"

volumes:
  pgdata:
  appdata:
  aimodels:
