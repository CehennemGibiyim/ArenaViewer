name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Veritabanı şemasını uygula
        run: npx drizzle-kit push --config=drizzle.config.ts --force

      - name: Next.js tip üretimi
        run: npx next typegen

      - name: TypeScript kontrolü
        run: npm exec tsc -- --noEmit --pretty false

      - name: Lint (eslint)
        run: npm run lint

      - name: Üretim derlemesi
        run: npm run build

      - name: Birim testleri
        run: npm test


  # Gerçek PACS (Orthanc) ile uçtan uca DICOMweb testi: STOW yükle → QIDO bul →
  # WADO geri al → temizlik. ORTHANC_URL tanımsızca test kendini atlar.
  #
  # Bu iş BİLGİSEL/OPSİYONELDİR: CI konteyner ortamında Orthanc imajının ayağa
  # kalkışı bazen altyapı nedeniyle başarısız olur. Üretim engeli değildir; yerel
  # doğrulama: docker compose --profile pacs up -d && npm run test:pacs-e2e
  pacs-e2e:
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      # Kayıtlı kullanıcı tanımlamadan (anonim) başlatılır; böylece ayakta
      # kalma koşulu yalnizca servisin yanıt vermesine bağlanır.
      orthanc:
        image: jodogne/orthanc:latest
        env:
          ORTHANC__NAME: "ArenaViewer E2E PACS"
        ports:
          - 8042:8042
        # Saglik kontrolu bilinçli olarak YOK: komut servis container'ının içinde
        # çalişir ve jodogne/orthanc imajinda curl bulunmayabilir. Hazirlik, iş
        # akışindaki 'Orthanc hazır' adimindaki anfiton curl döngüsüyle yapilir.
    env:
      ORTHANC_URL: http://localhost:8042
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Orthanc hazır
        run: |
          for i in $(seq 1 90); do
            if curl -sf "$ORTHANC_URL/system" > /dev/null; then
              echo "Orthanc hazır"; curl -s "$ORTHANC_URL/system" | head -c 400; echo; exit 0
            fi
            sleep 2
          done
          echo "Orthanc 180 sn içinde hazır olmadı"; curl -sv "$ORTHANC_URL/system" 2>&1 | tail -20; exit 1

      - name: DICOMweb uçtan uca testi (STOW/QIDO/WADO)
        run: npm run test:pacs-e2e

  # Tarayıcı regresyon testleri: menü etkileşimleri, klasör içe aktarma,
  # görüntü incelemesi (15 + 3 + 5 kontrol). Üretim derlemesi + next start
  # ile çalışır; WebGL/headless chromium yeterlidir.
  ui-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
      # Test-only synthetic series are compiled into this UI-test artifact only.
      NEXT_PUBLIC_E2E_FIXTURES: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Veritabanı şemasını uygula
        run: npx drizzle-kit push --config=drizzle.config.ts --force

      - name: Playwright chromium kur
        run: npx playwright install --with-deps chromium

      - name: Üretim derlemesi
        run: npm run build

      - name: Sunucuyu başlat
        run: |
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "sunucu hazır"; exit 0
            fi
            sleep 2
          done
          echo "sunucu 120 sn içinde hazır olmadı"; tail -50 server.log; exit 1

      - name: Menü etkileşim testleri (16 kontrol)
        run: npm run test:menu

      - name: Klasör içe aktarma testleri (3 kontrol)
        run: npm run test:folder

      - name: Görüntü inceleme testleri (5 kontrol)
        run: npm run test:review

      - name: Rapor onay + derin AI akışı (CI'da onay tamamlanır)
        run: npm run test:report-flow

      - name: Sunucu günlüğü (hata durumunda)
        if: failure()
        run: tail -100 server.log
