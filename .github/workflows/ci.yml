name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Veritabanı şemasını uygula
        run: npx drizzle-kit push --config=drizzle.config.ts --force

      - name: Next.js tip üretimi
        run: npx next typegen

      - name: TypeScript kontrolü
        run: npm exec tsc -- --noEmit --pretty false

      - name: Lint (eslint)
        run: npm run lint

      - name: Üretim derlemesi
        run: npm run build

      - name: Birim testleri
        run: npm test

      - name: PostgreSQL kimlik ve MFA giriş testi
        env:
          AUTH_INTEGRATION_TEST: "1"
        run: npm run test:auth-integration


  # Gerçek PACS (Orthanc) ile uçtan uca DICOMweb testi: STOW yükle → QIDO bul →
  # WADO geri al → temizlik. ORTHANC_URL tanımsızca test kendini atlar.
  #
  # Bu iş BİLGİSEL/OPSİYONELDİR: CI konteyner ortamında Orthanc imajının ayağa
  # kalkışı bazen altyapı nedeniyle başarısız olur. Üretim engeli değildir; yerel
  # doğrulama: docker compose --profile pacs up -d && npm run test:pacs-e2e
  pacs-e2e:
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      # E2E testinin kullandığı kullanıcı/şifre ile başlatılır.
      orthanc:
        image: jodogne/orthanc-plugins:latest
        env:
          ORTHANC__NAME: "ArenaViewer E2E PACS"
        ports:
          - 8042:8042
        # Saglik kontrolu bilinçli olarak YOK: komut servis container'ının içinde
        # çalişir ve jodogne/orthanc imajinda curl bulunmayabilir. Hazirlik, iş
        # akışindaki 'Orthanc hazır' adimindaki anfiton curl döngüsüyle yapilir.
    env:
      ORTHANC_URL: http://localhost:8042
      ORTHANC_USER: orthanc
      ORTHANC_PASS: orthanc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Orthanc hazır
        run: |
          for i in $(seq 1 90); do
            if curl -sf -u "$ORTHANC_USER:$ORTHANC_PASS" "$ORTHANC_URL/system" > /dev/null; then
              echo "Orthanc hazır"; curl -s -u "$ORTHANC_USER:$ORTHANC_PASS" "$ORTHANC_URL/system" | head -c 400; echo; exit 0
            fi
            sleep 2
          done
          echo "Orthanc 180 sn içinde hazır olmadı"; curl -sv -u "$ORTHANC_USER:$ORTHANC_PASS" "$ORTHANC_URL/system" 2>&1 | tail -20; exit 1

      - name: DICOMweb uçtan uca testi (STOW/QIDO/WADO)
        run: |
          set -o pipefail
          npm run test:pacs-e2e 2>&1 | tee /tmp/pacs-test.log || {
            message=$(tail -40 /tmp/pacs-test.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::error title=Orthanc test çıktısı::$message"
            exit 1
          }

  # Güvenlik açısından bağımlılık denetimi (G3): PR'da yeni/ değişen bağımlılıklar
  # bilinen kritik açıkları ve denetimin çalışamamasını başarısız gösterir.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Özet yorumu PR'a yazılacağı için pull-requests: write gerekir.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Dependency Graph kapalıysa başarısız olmalı; yeşil sonuç denetim yapıldığını göstermeli.
      - name: Bağımlılık denetimi
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          comment-summary-in-pr: true

  # Tarayıcı regresyon testleri: menü etkileşimleri, klasör içe aktarma,
  # görüntü incelemesi (15 + 3 + 5 kontrol). Üretim derlemesi + next start
  # ile çalışır; WebGL/headless chromium yeterlidir.
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
      # Test-only synthetic series are compiled into this UI-test artifact only.
      NEXT_PUBLIC_E2E_FIXTURES: "true"
      # Bağımsız tarayıcı testleri aynı IP üzerinden kısa sürede analiz çalıştırır.
      # Hız sınırı test:webhard içinde ayrıca doğrulanır; üretimde kapatılmaz.
      AV_RATE_LIMIT: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Veritabanı şemasını uygula
        run: npx drizzle-kit push --config=drizzle.config.ts --force

      - name: Playwright chromium kur
        run: npx playwright install --with-deps chromium

      - name: Üretim derlemesi
        run: npm run build

      - name: Sunucuyu başlat
        run: |
          nohup npm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "sunucu hazır"; exit 0
            fi
            sleep 2
          done
          echo "sunucu 120 sn içinde hazır olmadı"; tail -50 server.log; exit 1

      - name: Menü etkileşim testleri (16 kontrol)
        run: |
          set -o pipefail
          npm run test:menu 2>&1 | tee /tmp/menu-test.log || {
            message=$(tail -40 /tmp/menu-test.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::error title=Menü test çıktısı::$message"
            exit 1
          }

      - name: Klasör içe aktarma testleri (3 kontrol)
        run: |
          set -o pipefail
          npm run test:folder 2>&1 | tee /tmp/folder-test.log || {
            message=$(tail -40 /tmp/folder-test.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::error title=folder test çıktısı::$message"
            exit 1
          }

      - name: Görüntü inceleme testleri (5 kontrol)
        run: |
          set -o pipefail
          npm run test:review 2>&1 | tee /tmp/review-test.log || {
            message=$(tail -40 /tmp/review-test.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::error title=review test çıktısı::$message"
            exit 1
          }

      - name: Rapor onay + derin AI akışı (CI'da onay tamamlanır)
        run: |
          set -o pipefail
          npm run test:report-flow 2>&1 | tee /tmp/report-flow-test.log || {
            message=$(tail -40 /tmp/report-flow-test.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g')
            echo "::error title=report-flow test çıktısı::$message"
            exit 1
          }

      - name: Sunucu günlüğü (hata durumunda)
        if: failure()
        run: tail -100 server.log
