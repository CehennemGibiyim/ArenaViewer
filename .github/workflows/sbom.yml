name: SBOM

# CycloneDX yazılım bileşen listesi (G3). v* etiketlerinde üretilir ve GitHub
# Release'a eklenir; elle de çalıştırılabilir. Sağlama/attestation için
# actions/attest-build-provenance eklenebilir.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cyclonedx:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: SBOM üret (CycloneDX 1.6)
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom.json --spec-version 1.6 --validate

      - name: Derleme ürünü olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          if-no-files-found: error

      - name: Release'a ekle (etiketli sürümde)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" sbom.json --clobber
