name: CodeQL

# Statik güvenlik analizi (G3 tedarik zinciri). JavaScript/TypeScript için
# github/codeql-action; derleme gerekmez. Haftalık + main'e push + PR'ler.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
