name: Release

# vX.Y.Z gibi bir etiket itildiğinde Windows kurulum paketi ve taşınabilir ZIP
# üretilir, GitHub Releases'e yüklenir. Uygulama açılışta bu sürümü kontrol eder.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Etiket olmadan derlemek için sürüm (örn. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sürüm tutarlılığını denetle
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v${{ inputs.version }}" }
          $version = $tag -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $src = (Select-String -Path src/lib/version.ts -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($version -ne $pkg -or $version -ne $src) {
            throw "Sürüm uyuşmuyor — etiket: $version, package.json: $pkg, src/lib/version.ts: $src"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - run: npm ci

      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: Kurulum paketi ve taşınabilir ZIP üret
        shell: pwsh
        run: ./windows/Paket.ps1 -Version $env:VERSION

      - name: SHA-256 özet dosyası üret
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object {
            $_.Name -match '^ATIKVIEWER-[0-9]+\.[0-9]+\.[0-9]+-(Setup\.exe|portable\.zip)$'
          }
          if (-not $files) { throw "Paket dosyaları bulunamadı; SHA256SUMS üretilemedi." }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -Path dist/SHA256SUMS -Value $lines -Encoding ascii

      - name: Release yayınla
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ATIKVIEWER v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/ATIKVIEWER-${{ env.VERSION }}-Setup.exe
            dist/ATIKVIEWER-${{ env.VERSION }}-portable.zip
            dist/SHA256SUMS

      - name: Derleme çıktılarını sakla (elle çalıştırmada)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ATIKVIEWER-${{ env.VERSION }}-windows
          path: dist/*

  # ── Linux: .deb + taşınabilir tar.gz + evrensel kurulum ZIP'i ──────────────
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sürüm tutarlılığını denetle
        shell: bash
        run: |
          tag="${GITHUB_REF_TYPE:-branch}"
          if [ "$tag" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="${{ github.event.inputs.version }}"; fi
          pkg=$(node -p "require('./package.json').version")
          src=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/lib/version.ts)
          if [ "$version" != "$pkg" ] || [ "$version" != "$src" ]; then
            echo "Sürüm uyuşmuyor — etiket: $version, package.json: $pkg, src/lib/version.ts: $src"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Debian/Ubuntu paketi ve taşınabilir arşiv üret
        run: bash packaging/linux/build-deb.sh

      - name: Evrensel kurulum ZIP'i üret
        run: bash packaging/universal/build-source-zip.sh

      - name: Kurulum sonrası doğrulama betiğini de paketle
        run: bash packaging/universal/verify.sh || true

      - name: Release yayınla
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ATIKVIEWER v${{ env.VERSION }} — Linux
          files: |
            dist/ATIKVIEWER-${{ env.VERSION }}-amd64.deb
            dist/ATIKVIEWER-${{ env.VERSION }}-linux.tar.gz
            dist/ATIKVIEWER-${{ env.VERSION }}-kurulum.zip

      - name: Derleme çıktılarını sakla (elle çalıştırmada)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ATIKVIEWER-${{ env.VERSION }}-linux
          path: dist/*

  # ── macOS: DMG + taşınabilir tar.gz ────────────────────────────────────────
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sürüm tutarlılığını denetle
        shell: bash
        run: |
          tag="${GITHUB_REF_TYPE:-branch}"
          if [ "$tag" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="${{ github.event.inputs.version }}"; fi
          pkg=$(node -p "require('./package.json').version")
          src=$(sed -n 's/.*APP_VERSION = "\([^"]*\)".*/\1/p' src/lib/version.ts)
          if [ "$version" != "$pkg" ] || [ "$version" != "$src" ]; then
            echo "Sürüm uyuşmuyor — etiket: $version, package.json: $pkg, src/lib/version.ts: $src"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: DMG ve taşınabilir arşiv üret
        run: bash packaging/macos/build-dmg.sh

      - name: Release yayınla
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ATIKVIEWER v${{ env.VERSION }} — macOS
          files: |
            dist/ATIKVIEWER-${{ env.VERSION }}-macOS.dmg
            dist/ATIKVIEWER-${{ env.VERSION }}-macOS.tar.gz

      - name: Derleme çıktılarını sakla (elle çalıştırmada)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ATIKVIEWER-${{ env.VERSION }}-macos
          path: dist/*
