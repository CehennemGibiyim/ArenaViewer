<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 230" width="940" height="230" role="img" aria-label="Resimli anlatım akışı: bölüm seç, adımın nerede olduğunu oku, uygula, sonucu doğrula; rozetler adımın web demosunda mı yoksa yerel kurulumda mı çalıştığını gösterir">
  <rect width="940" height="230" rx="12" fill="#0b0f16"/>
  <g font-family="'Segoe UI',system-ui,Arial,sans-serif">
    <!-- kutular -->
    <g fill="#0e141d" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5">
      <rect x="14" y="34" width="150" height="86" rx="9"/>
      <rect x="184" y="34" width="150" height="86" rx="9"/>
      <rect x="354" y="34" width="150" height="86" rx="9"/>
      <rect x="524" y="34" width="150" height="86" rx="9"/>
    </g>
    <g fill="#0e141d" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.5">
      <rect x="704" y="34" width="222" height="86" rx="9"/>
    </g>
    <!-- numaralar -->
    <g fill="#22d3ee" font-size="16" font-weight="700" text-anchor="middle">
      <text x="89" y="62">1</text><text x="259" y="62">2</text><text x="429" y="62">3</text><text x="599" y="62">4</text>
    </g>
    <text x="815" y="62" fill="#c4b5fd" font-size="16" font-weight="700" text-anchor="middle">?</text>
    <!-- başlıklar -->
    <g fill="#e2e8f0" font-size="12.5" font-weight="600" text-anchor="middle">
      <text x="89" y="84">Bölümü seç</text>
      <text x="259" y="84">“Nerede” satırını oku</text>
      <text x="429" y="84">Adımı uygula</text>
      <text x="599" y="84">“Ne olur” ile doğrula</text>
      <text x="815" y="84">Sonuç beklenenden farklı mı?</text>
    </g>
    <!-- alt açıklamalar -->
    <g fill="#94a3b8" font-size="10.5" text-anchor="middle">
      <text x="89" y="102">İçindekiler (8 bölüm)</text>
      <text x="259" y="102">Düğme/menü adı birebir</text>
      <text x="429" y="102">Ekran görüntüsüyle karşılaştır</text>
      <text x="599" y="102">Görüntü • ölçüm • rapor</text>
      <text x="815" y="102">Sorun giderme → /yardim</text>
    </g>
    <!-- oklar -->
    <g stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.6" fill="none">
      <path d="M164 77 h16" marker-end="url(#a)"/>
      <path d="M334 77 h16" marker-end="url(#a)"/>
      <path d="M504 77 h16" marker-end="url(#a)"/>
      <path d="M674 77 h26" marker-end="url(#a)"/>
      <path d="M815 120 v18" marker-end="url(#a)"/>
    </g>
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee" fill-opacity="0.8"/>
      </marker>
    </defs>
    <!-- alt bant: rozetler -->
    <rect x="14" y="150" width="912" height="62" rx="9" fill="#101722" stroke="#1f2a3a"/>
    <g font-size="11.5" font-weight="600">
      <rect x="28" y="166" width="168" height="26" rx="13" fill="#052e21" stroke="#10b981" stroke-opacity="0.6"/>
      <text x="112" y="183" fill="#6ee7b7" text-anchor="middle">WEB DEMOSUNDA DA</text>
      <text x="212" y="183" fill="#94a3b8" font-size="11" font-weight="400">→ /api gerekmez</text>

      <rect x="352" y="166" width="150" height="26" rx="13" fill="#2b1f06" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="427" y="183" fill="#fcd34d" text-anchor="middle">KISMÎ (SUNUCU)</text>
      <text x="516" y="183" fill="#94a3b8" font-size="11" font-weight="400">→ DB varsa tam</text>

      <rect x="686" y="166" width="176" height="26" rx="13" fill="#2b0b12" stroke="#f43f5e" stroke-opacity="0.6"/>
      <text x="774" y="183" fill="#fda4af" text-anchor="middle">YALNIZ YEREL KURULUM</text>
      <text x="874" y="183" fill="#94a3b8" font-size="11" font-weight="400">→ AI/worker</text>
    </g>
    <text x="470" y="205" fill="#64748b" font-size="10" text-anchor="middle">Görseller gerçek arayüzden alınmıştır; hiçbirinde hasta verisi yoktur.</text>
  </g>
</svg>
